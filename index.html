<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>花札こいこい (P2P Online)</title>

<!-- PeerJS CDN -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
/* 配置: 緑のフェルトの卓。上に相手、中央に場札と山、下に自分の手札。ロビーは卓の上に置いた規約カード。[span_8](start_span)[span_8](end_span) */
:root {
  --felt: #0f3a31; --felt-deep: #0a2a23; --felt-lite: #17493e;
  --paper: #f2ead4; --paper-edge: #d9ccaa; --ink: #1c1612;
  --text: #ece5d0; --muted: #a9b8ac; --line: rgba(236, 229, 208, .18);
  --shu: #c8321e; --shu-ink: #fff7e8; --gold: #d6a94a; --ai: #2b3a5e;
  --panel: rgba(0, 0, 0, .24);
  --serif: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --sans: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--felt);
  background-image:
    radial-gradient(ellipse at 50% 30%, var(--felt-lite) 0%, transparent 62%),
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .018) 0 2px, transparent 2px 5px);
  background-attachment: fixed;
  color: var(--text); font: 15px/1.6 var(--sans);
  padding-inline: 16px; padding-block: 12px 28px; min-height: 100%;
}
#app { max-width: 540px; margin-inline: auto; display: flex; flex-direction: column; gap: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); margin: 0; text-wrap: balance; }
small, .muted { color: var(--muted); }

/* ---------- 札 ----------[span_9](start_span)[span_9](end_span) */
.card {
  --w: 46px; --mc: #444;
  width: var(--w); aspect-ratio: 3 / 5; font-size: calc(var(--w) * .235);
  position: relative; display: block; padding: 0; border: 0; border-radius: .5em; flex: none;
  background: var(--paper); color: var(--ink); font-family: var(--serif); overflow: hidden;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 3px 7px rgba(0, 0, 0, .38);
  transition: transform .15s ease, box-shadow .15s ease;
}
[data-m="1"] { --mc: #2d6a3e; } [data-m="2"] { --mc: #b53a55; } [data-m="3"] { --mc: #c2587a; }
[data-m="4"] { --mc: #6b4fa0; } [data-m="5"] { --mc: #3a4fa8; } [data-m="6"] { --mc: #b0245a; }
[data-m="7"] { --mc: #a23a4a; } [data-m="8"] { --mc: #7a6a2a; } [data-m="9"] { --mc: #9a6b00; }
[data-m="10"] { --mc: #c1441c; } [data-m="11"] { --mc: #2a7a74; } [data-m="12"] { --mc: #6a3f8a; }
.card .mn { position: absolute; left: .35em; top: .2em; font: 700 .78em var(--sans); opacity: .65; }
.card .ty { position: absolute; right: .35em; top: .2em; font-size: .75em; font-weight: 800; color: var(--mc); }
.card .pl { position: absolute; left: 0; right: 0; bottom: .22em; text-align: center; font-weight: 800; font-size: 1.05em; color: var(--mc); letter-spacing: 0; }
.card .big { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.3em; font-weight: 800; color: var(--mc); padding-bottom: .7em; }
.card .pl.big { font-size: 2.1em; padding-bottom: .1em; inset: 0; bottom: 0; opacity: .85; }
.card.ty-hikari { background: linear-gradient(180deg, #f8efcf, var(--paper) 60%); box-shadow: inset 0 0 0 .22em var(--gold), 0 1px 0 rgba(0, 0, 0, .4), 0 3px 7px rgba(0, 0, 0, .38); }
.card .sun { position: absolute; left: 50%; top: 24%; width: 3.1em; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: var(--shu); display: grid; place-items: center; }
.card .sun b { color: var(--shu-ink); font-size: 1.7em; font-weight: 800; line-height: 1; }
.card .rib { position: absolute; left: 50%; top: 10%; bottom: 24%; width: 1.9em; transform: translateX(-50%); border-radius: .15em; display: grid; place-items: center; background: #e7d9b4; border: 1px solid var(--paper-edge); }
.card .rib.aka { background: var(--shu); border-color: var(--shu); }
.card .rib.ao { background: var(--ai); border-color: var(--ai); }
.card .rib.plain { background: linear-gradient(#e7d9b4, #e7d9b4); border-top: .35em solid var(--mc); }
.card .rib b { writing-mode: vertical-rl; font-size: .8em; font-weight: 800; color: var(--shu-ink); white-space: nowrap; line-height: 1; }
.card .rib b.t5 { font-size: .62em; }
.card.back {
  background: var(--shu); box-shadow: inset 0 0 0 .2em var(--paper), inset 0 0 0 .32em var(--shu), 0 3px 7px rgba(0, 0, 0, .38);
  background-image: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, .22) 0 .9em, transparent .95em);
}
.card.sel { transform: translateY(-10px); box-shadow: 0 0 0 2px var(--gold), 0 8px 14px rgba(0, 0, 0, .45); }
.card.hint { box-shadow: 0 0 0 2px var(--gold), 0 0 14px 2px rgba(214, 169, 74, .65); animation: pulse 1.1s ease-in-out infinite alternate; }
.card.fx { box-shadow: 0 0 0 2px var(--shu), 0 0 12px 2px rgba(200, 50, 30, .7); }
@keyframes pulse { to { transform: translateY(-3px); } }

/* ---------- 取り札(チップ) ----------[span_10](start_span)[span_10](end_span) */
.cap { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 10px; justify-content: start; align-items: start; }
.cg { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cg .cl { font-size: .68rem; color: var(--muted); letter-spacing: .12em; }
.cc { display: flex; flex-wrap: wrap; gap: 2px; max-width: 150px; }
.cg.ty-kasu .cc { max-width: 190px; }
.chip { width: 1.45rem; height: 1.8rem; border-radius: .22rem; background: var(--paper); color: var(--mc); display: grid; place-items: center; font: 800 .86rem/1 var(--serif); font-style: normal; box-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
.chip.ty-hikari { box-shadow: inset 0 0 0 2px var(--gold); }
.chip.aka { background: var(--shu); color: var(--shu-ink); } .chip.ao { background: var(--ai); color: var(--shu-ink); }
.chip.ty-kasu { opacity: .8; }
.chip.fx { outline: 2px solid var(--shu); }
.none { color: var(--muted); font-size: .8rem; }

/* ---------- 共通パーツ ----------[span_11](start_span)[span_11](end_span) */
.btn { border: 1px solid var(--gold); background: transparent; color: var(--text); border-radius: .5rem; padding: .62rem 1.1rem; min-height: 44px; font-weight: 700; }
.btn.pri { background: var(--shu); border-color: var(--shu); color: var(--shu-ink); }
.btn.sm { min-height: 36px; padding: .3rem .8rem; font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: .75rem; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.err { color: #ffb4a6; font-size: .9rem; margin: 0; }
.note { color: var(--muted); font-size: .85rem; margin: 0; }
input[type=text] { background: rgba(0, 0, 0, .3); border: 1px solid var(--line); color: var(--text); border-radius: .5rem; padding: .6rem .8rem; min-height: 44px; font: inherit; width: 100%; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }

/* ---------- タイトル ----------[span_12](start_span)[span_12](end_span) */
.title { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-block: 18px 6px; text-align: center; }
.title h1 { font-size: 3.6rem; letter-spacing: .12em; line-height: 1.1; padding-left: .12em; }
.title h1 span { color: var(--shu); }
.title p { margin: 0; color: var(--muted); letter-spacing: .3em; font-size: .85rem; }
.fan { display: flex; justify-content: center; margin-block: 6px 2px; }
.fan .card { --w: 56px; margin-inline: 3px; }
.fan .card:nth-child(1) { transform: rotate(-14deg) translateY(4px); } .fan .card:nth-child(2) { transform: rotate(-5deg); }
.fan .card:nth-child(3) { transform: rotate(5deg); } .fan .card:nth-child(4) { transform: rotate(14deg) translateY(4px); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.row > * { min-width: 0; }
.codeIn { flex: 1 1 8rem; } .codeIn input { text-transform: uppercase; letter-spacing: .3em; text-align: center; font: 700 1.1rem var(--serif); }

/* ---------- ロビー ----------[span_13](start_span)[span_13](end_span) */
.codeBox { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.code { font: 800 2.4rem/1 var(--serif); letter-spacing: .3em; padding-left: .3em; color: var(--gold); }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seat { border: 1px dashed var(--line); border-radius: .6rem; padding: 8px 10px; min-height: 52px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.seat.on { border-style: solid; background: rgba(255, 255, 255, .04); }
.seat b { overflow-wrap: anywhere; } .seat small { font-size: .75rem; }
.rgroup { display: flex; flex-direction: column; gap: 2px; }
.rgroup > h3 { font-size: 1rem; color: var(--gold); letter-spacing: .15em; margin-bottom: 4px; }
.rrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.rl { display: flex; flex-direction: column; min-width: 0; flex: 1 1 0; } .rl small { font-size: .76rem; line-height: 1.35; }
.rl b { font-weight: 700; }
.pts { color: var(--gold); font-weight: 700; font-size: .78rem; margin-left: .4em; }
.seg { display: flex; border: 1px solid var(--line); border-radius: .5rem; overflow: hidden; flex: none; }
.seg button { background: transparent; border: 0; padding: .4rem .7rem; min-height: 38px; font-size: .82rem; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--shu); color: var(--shu-ink); font-weight: 700; }
.seg button:disabled { cursor: default; }
.tog { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; padding: 4px 0; min-height: 38px; flex: none; min-width: 78px; justify-content: flex-end; }
.tog i { width: 38px; height: 22px; border-radius: 11px; background: rgba(255, 255, 255, .16); position: relative; flex: none; transition: background .15s; }
.tog i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); transition: transform .15s; }
.tog.on i { background: var(--shu); } .tog.on i::after { transform: translateX(16px); }
.tog span { font-size: .8rem; width: 2.2em; text-align: left; }
.tog:disabled { cursor: default; }

/* ---------- 対局 ----------[span_14](start_span)[span_14](end_span) */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.round { font: 800 1.25rem var(--serif); letter-spacing: .1em; } .round small { font: 500 .8rem var(--sans); letter-spacing: 0; }
.plate { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 12px; border-radius: .7rem; background: var(--panel); border: 1px solid var(--line); }
.plate.turn { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.plate .nm { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.plate .sc { font: 800 1.7rem/1 var(--serif); font-variant-numeric: tabular-nums; grid-row: span 2; align-self: center; }
.plate .tg { display: flex; gap: 6px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); }
.tag { border: 1px solid var(--line); border-radius: 1rem; padding: 0 .55rem; } .tag.shu { background: var(--shu); border-color: var(--shu); color: var(--shu-ink); }
.zone { display: flex; flex-direction: column; gap: 6px; }
.oppHand { display: flex; gap: 3px; align-items: center; min-height: 40px; }
.oppHand .card { --w: 24px; } .oppHand span { margin-left: 8px; font-size: .8rem; color: var(--muted); }
.table { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: .9rem; background: var(--felt-deep); border: 1px solid var(--line); box-shadow: inset 0 2px 12px rgba(0, 0, 0, .45); }
.pile { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; font-size: .75rem; color: var(--muted); }
.pile .card { --w: 46px; } .pile .drawn { --w: 46px; }
.field { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 0; min-width: 0; align-content: flex-start; min-height: 80px; }
.field .card { --w: 46px; }
.field .card.hint, .field button.card { cursor: pointer; }
.msg { min-height: 2.6em; margin: 0; text-align: center; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.msg.me { color: var(--gold); }
.hand { display: flex; gap: 4px; justify-content: center; padding-top: 12px; }
.hand .card { --w: calc((min(100vw, 540px) - 32px - 28px) / 8); max-width: 62px; cursor: pointer; }
.hand .card.fx { box-shadow: 0 0 0 2px var(--shu); }
.yk { font-size: .8rem; color: var(--muted); min-height: 1.3em; margin: 0; }
.yk b { color: var(--gold); }
.log { font-size: .8rem; color: var(--muted); margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1px; }
.sheet { background: #1b2a26; border: 1px solid var(--gold); border-radius: .9rem; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
.sheet h2 { font-size: 1.45rem; letter-spacing: .08em; }
.ylist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ylist li { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 3px 0; }
.ylist li b { font-family: var(--serif); font-size: 1.05rem; } .ylist li span { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; }
.mult { display: flex; gap: 6px; flex-wrap: wrap; } .mult .tag { color: var(--gold); border-color: var(--gold); }
.total { font: 800 2.2rem/1.1 var(--serif); color: var(--gold); font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .two .btn { width: 100%; }
.score { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 14px; font-variant-numeric: tabular-nums; font-size: .95rem; }
.score .h { color: var(--muted); font-size: .75rem; }
.score .r { text-align: right; }
@media (max-width: 380px) { .title h1 { font-size: 3rem; } .code { font-size: 2rem; } .cc { max-width: 120px; } }

.card i, .card em { font-style: normal; }
.card .pl.big .v { writing-mode: vertical-rl; font-size: .8em; letter-spacing: .05em; white-space: nowrap; line-height: 1; }
.rrow.stack { flex-direction: column; align-items: stretch; gap: 6px; }
.rrow.stack .seg { align-self: stretch; } .rrow.stack .seg button { flex: 1; }
</style>

<script>
/* ===== 花札 こいこい: ゲームエンジン(DOM非依存・2人対戦)[span_15](start_span)[span_15](end_span) ===== */
const MONTHS = ['松', '梅', '桜', '藤', '菖蒲', '牡丹', '萩', '芒', '菊', '紅葉', '柳', '桐'];
const CARDS = [];
(function () {
  const D = [
    [['松に鶴', 'hikari', 'tsuru'], ['松に赤短', 'tan', 'aka'], ['松のカス', 'kasu'], ['松のカス', 'kasu']],
    [['梅に鶯', 'tane', 'uguisu'], ['梅に赤短', 'tan', 'aka'], ['梅のカス', 'kasu'], ['梅のカス', 'kasu']],
    [['桜に幕', 'hikari', 'maku'], ['桜に赤短', 'tan', 'aka'], ['桜のカス', 'kasu'], ['桜のカス', 'kasu']],
    [['藤にホトトギス', 'tane', 'hototogisu'], ['藤に短冊', 'tan', ''], ['藤のカス', 'kasu'], ['藤のカス', 'kasu']],
    [['菖蒲に八橋', 'tane', 'yatsuhashi'], ['菖蒲に短冊', 'tan', ''], ['菖蒲のカス', 'kasu'], ['菖蒲のカス', 'kasu']],
    [['牡丹に蝶', 'tane', 'cho'], ['牡丹に青短', 'tan', 'ao'], ['牡丹のカス', 'kasu'], ['牡丹のカス', 'kasu']],
    [['萩に猪', 'tane', 'ino'], ['萩に短冊', 'tan', ''], ['萩のカス', 'kasu'], ['萩のカス', 'kasu']],
    [['芒に月', 'hikari', 'tsuki'], ['芒に雁', 'tane', 'kari'], ['芒のカス', 'kasu'], ['芒のカス', 'kasu']],
    [['菊に盃', 'tane', 'sakazuki'], ['菊に青短', 'tan', 'ao'], ['菊のカス', 'kasu'], ['菊のカス', 'kasu']],
    [['紅葉に鹿', 'tane', 'shika'], ['紅葉に青短', 'tan', 'ao'], ['紅葉のカス', 'kasu'], ['紅葉のカス', 'kasu']],
    [['柳に小野道風', 'hikari', 'ame'], ['柳に燕', 'tane', 'tsubame'], ['柳に短冊', 'tan', ''], ['柳のカス', 'kasu']],
    [['桐に鳳凰', 'hikari', 'houou'], ['桐のカス', 'kasu'], ['桐のカス', 'kasu'], ['桐のカス', 'kasu']]
  ];
  D.forEach((list, mi) => list.forEach((c, k) =>
    CARDS.push({ id: mi * 4 + k, m: mi + 1, name: c[0], type: c[1], tag: c[2] || '' })));
})();
const SAKAZUKI = CARDS.find(c => c.tag === 'sakazuki').id;
const TEYAKU_PTS = 6;

const DEFAULT_RULES = {
  rounds: 3, parentNext: 'winner', koiLimit: 0, koiBack: true, double7: true,
  exhaust: 'draw', bonus: true, sakazukiKasu: true, teyaku: false,
  yaku: {
    goko: true, shiko: true, ameshiko: true, sanko: true,
    hanami: true, tsukimi: true, inoshikacho: true,
    akatan: true, aotan: true, tane: true, tan: true, kasu: true
  }
};
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function normRules(r) {
  const d = clone(DEFAULT_RULES);
  if (!r) return d;
  for (const k in r) {
    if (k === 'yaku') Object.assign(d.yaku, r.yaku);
    else if (k in d) d[k] = r[k];
  }
  return d;
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function other(s) { return s === 'a' ? 'b' : 'a'; }
function sameMonth(field, card) { return field.filter(c => CARDS[c].m === CARDS[card].m); }

function scoreVariant(ids, R, asKasu) {
  const cs = ids.map(i => CARDS[i]);
  const Y = R.yaku, ys = [];
  const has = t => cs.some(c => c.tag === t);
  const add = (name, pts) => ys.push({ name, pts });
  const sak = has('sakazuki');
  const hik = cs.filter(c => c.type === 'hikari').length;
  const rain = has('ame');
  const n = hik - (rain ? 1 : 0);
  let lp = 0, ln = '';
  const cand = (ok, p, nm) => { if (ok && p > lp) { lp = p; ln = nm; } };
  cand(Y.goko && n === 4 && rain, 10, '五光');
  cand(Y.shiko && n === 4, 8, '四光');
  cand(Y.ameshiko && n === 3 && rain, 7, '雨四光');
  cand(Y.sanko && n >= 3, 5, '三光');
  if (lp) add(ln, lp);
  if (Y.hanami && has('maku') && sak) add('花見で一杯', 5);
  if (Y.tsukimi && has('tsuki') && sak) add('月見で一杯', 5);
  const useKasu = asKasu && sak;
  const tane = cs.filter(c => c.type === 'tane').length - (useKasu ? 1 : 0);
  const tan = cs.filter(c => c.type === 'tan').length;
  const kasu = cs.filter(c => c.type === 'kasu').length + (useKasu ? 1 : 0);
  const extra = (k) => R.bonus ? Math.max(0, k - 3) : 0;
  if (Y.inoshikacho && has('ino') && has('shika') && has('cho')) add('猪鹿蝶', 5 + extra(tane));
  if (Y.akatan && cs.filter(c => c.tag === 'aka').length === 3) add('赤短', 5 + extra(tan));
  if (Y.aotan && cs.filter(c => c.tag === 'ao').length === 3) add('青短', 5 + extra(tan));
  if (Y.tane && tane >= 5) add('タネ', tane - 4);
  if (Y.tan && tan >= 5) add('タン', tan - 4);

      : Array.from({ length: oppCards }, () => '<div class="card back"></div>').join('');
    const hand = g.hand[me].slice().sort((a, b) => a - b).map(id => cardHTML(id, { btn: myTurn && g.phase === 'hand', a: 'hand', cls: S.sel === id ? 'sel' : '' })).join('');
    const sheet = over ? endSheet(g, me, nm) : (myTurn && g.phase === 'decide' ? decideSheet(g, me) : '');
    return '<div class="bar"><div class="round">' + g.round + '月戦 <small>/ 全' + R.rounds + '回</small></div>' + leaveBtn() + '</div>' +
      '<div class="zone">' + plate(op) + '<div class="oppHand">' + oppHand + '<span>' + (reveal ? '' : '手札 ' + oppCards + '枚') + '</span></div>' + capHTML(g.cap[op], g.fx) +
      (g.cap[op].length ? '<p class="yk">' + yakuLine(sc(op)) + '</p>' : '') + '</div>' +
      '<div class="table"><div class="pile">' + (g.drawn != null ? cardHTML(g.drawn, { cls: 'fx' }) : '<div class="card back"></div>') + '<span>山札 ' + g.deck.length + '</span></div><div class="field">' + fieldHTML + '</div></div>' +
      (sheet || '<p class="msg' + (myTurn ? ' me' : '') + '">' + msg + '</p>') +
      '<div class="zone">' + capHTML(g.cap[me], g.fx) + (g.cap[me].length ? '<p class="yk">' + yakuLine(sc(me)) + '</p>' : '') + plate(me) + '</div>' +
      '<div class="hand">' + hand + '</div>' +
      '<ul class="log">' + g.log.slice(-3).map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>' +
      (S.err ? '<p class="err">' + esc(S.err) + '</p>' : '');
  }

  function yakuList(ys) { return '<ul class="ylist">' + ys.map(y => '<li><b>' + esc(y.name) + '</b><span>' + y.pts + '点</span></li>').join('') + '</ul>'; }
  function decideSheet(g, me) {
    const R = g.rules, s = calcScore(g.cap[me], R);
    const canKoi = !(R.koiLimit === 1 && g.kc[me] >= 1);
    const back = R.koiBack && g.kc[other(me)] > 0;
    return '<section class="sheet" aria-live="polite"><h2>役ができました</h2>' + yakuList(s.yaku) +
      '<div class="mult">' + (s.doubled ? '<span class="tag">7点以上で2倍</span>' : '') + (back ? '<span class="tag">こいこい返しで2倍</span>' : '') + '</div>' +
      '<div class="total">' + (s.pts * (back ? 2 : 1)) + '点</div>' +
      '<div class="two"><button class="btn" data-a="koi"' + (canKoi ? '' : ' disabled') + '>こいこい</button><button class="btn pri" data-a="shobu">勝負</button></div>' + '</section>';
  }
  function endSheet(g, me, nm) {
    const res = g.result, R = g.rules;
    let title = res.winner ? nm(res.winner) + 'の勝ち' : '引き分け';
    const rowS = x => '<span>' + esc(nm(x)) + '</span><span class="r">' + (res.winner === x ? '+' + res.pts : '0') + '</span><span class="r">' + g.total[x] + '</span>';
    let body = res.winner ? yakuList(res.yaku) + '<div class="mult">' + (res.doubled ? '<span class="tag">7点以上で2倍</span>' : '') + (res.back ? '<span class="tag">こいこい返しで2倍</span>' : '') + '</div><div class="total">+' + res.pts + '点</div>' : '<p class="note">引き分けです。</p>';
    let btns = g.final ? '<div class="two"><button class="btn pri" data-a="next">もう一度</button></div>' : '<button class="btn pri" data-a="next">次へ</button>';
    return '<section class="sheet" aria-live="polite"><h2>' + esc(title) + '</h2>' + body +
      '<div class="score"><span class="h"></span><span class="h r">今回</span><span class="h r">合計</span>' + rowS('a') + rowS('b') + '</div>' + btns + '</section>';
  }

  function render() {
    $app.innerHTML = !S.room ? titleHTML() : !S.room.g ? lobbyHTML() : gameHTML();
    afterRender();
  }

  function afterRender() {
    const r = S.room;
    if (!r || !r.g) return;
    const g = r.g, me = seatOf(r);
    if (g.phase === 'draw' && g.turn === me && S.autoRev !== g.rev && S.isHost) {
      S.autoRev = g.rev;
      setTimeout(() => sendAction({ t: 'draw', by: me }), 600);
    }
  }

  // PeerJS 通信ロジック
  function initPeer(idStr) {
    return new Promise((resolve) => {
      if (S.peer) S.peer.destroy();
      S.peer = new Peer(idStr);
      S.peer.on('open', (id) => {
        S.myId = id;
        resolve(id);
      });
      S.peer.on('connection', (c) => {
        S.conn = c;
        setupConn();
      });
    });
  }

  function setupConn() {
    S.conn.on('data', (data) => {
      if (S.isHost) {
        // ホスト側：ゲストからアクションを受け取ってゲームを進行し、全同期
        if (data && data.action) {
          const nextG = reduce(S.room.g, data.action, Math.random);
          if (nextG) {
            S.room.g = nextG;
            broadcast();
          }
        }
      } else {
        // ゲスト側：ホストから最新のルーム状態を受信
        S.room = data;
        render();
      }
    });
    S.conn.on('close', () => {
      S.err = '接続が切れました';
      render();
    });
  }

  function broadcast() {
    if (S.conn && S.conn.open) {
      S.conn.send(S.room);
    }
    render();
  }

  function sendAction(act) {
    const me = seatOf(S.room);
    act.by = me;
    if (S.isHost) {
      const nextG = reduce(S.room.g, act, Math.random);
      if (nextG) {
        S.room.g = nextG;
        broadcast();
      }
    } else {
      if (S.conn && S.conn.open) {
        S.conn.send({ type: 'ACTION', action: act });
      }
    }
  }

  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const genCode = () => Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');

  const H = {
    async create() {
      S.err = '';
      const code = genCode();
      const peerId = 'HF-' + code;
      await initPeer(peerId);
      S.code = code;
      S.isHost = true;
      S.room = {
        code,
        seats: { a: { id: S.myId, name: (S.name || '').trim() || 'プレイヤー' }, b: null },
        rules: normRules(),
        g: null
      };
      render();
    },
    async join() {
      S.err = '';
      const code = (S.codeIn || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length !== 4) { S.err = '4文字の部屋コードを入れてください'; render(); return; }
      const myRandomId = 'HF-USER-' + Math.random().toString(36).substring(2, 6);
      await initPeer(myRandomId);
      S.code = code;
      S.isHost = false;
      const targetPeerId = 'HF-' + code;
      S.conn = S.peer.connect(targetPeerId);
      setupConn();

      S.conn.on('open', () => {
        // 参加要求を送る
        S.conn.send({ type: 'JOIN', name: (S.name || '').trim() || 'プレイヤー', id: S.myId });
      });
      // ゲスト側の初回接続時データ受信用にリスナー追加
      S.conn.on('data', (data) => {
        if (data.type === 'ROOM_STATE') {
          S.room = data.room;
          render();
        } else if (!S.isHost) {
          S.room = data;
          render();
        }
      });
    },
    copy() {
      navigator.clipboard.writeText(S.code).then(() => {
        S.copied = true; render();
        setTimeout(() => { S.copied = false; render(); }, 1800);
      });
    },
    start() {
      if (!S.isHost) return;
      S.room.g = newGame(S.room.code, { a: { name: S.room.seats.a.name }, b: { name: S.room.seats.b.name } }, S.room.rules);
      broadcast();
    },
    rule(t) {
      if (!S.isHost) return;
      const k = t.dataset.k, raw = t.dataset.v, v = isNaN(+raw) ? raw : +raw;
      S.room.rules[k] = v;
      broadcast();
    },
    toggle(t) {
      if (!S.isHost) return;
      const k = t.dataset.k;
      if (k.indexOf('yaku.') === 0) S.room.rules.yaku[k.slice(5)] = !S.room.rules.yaku[k.slice(5)];
      else S.room.rules[k] = !S.room.rules[k];
      broadcast();
    },
    hand(t) {
      const g = S.room && S.room.g, me = seatOf(S.room);
      if (!g || g.turn !== me || g.phase !== 'hand') return;
      const id = +t.dataset.id;
      if (S.sel === id) {
        if (sameMonth(g.field, id).length === 2) return;
        S.sel = null; sendAction({ t: 'play', card: id, target: null });
      } else { S.sel = id; render(); }
    },
    field(t) {
      const g = S.room && S.room.g, me = seatOf(S.room);
      if (!g || g.turn !== me) return;
      const id = +t.dataset.id;
      if (g.phase === 'pickHand' || g.phase === 'pickDraw') {
        if (g.sel && g.sel.opts.includes(id)) sendAction({ t: 'pick', target: id });
        return;
      }
      if (g.phase === 'hand' && S.sel != null) {
        const o = sameMonth(g.field, S.sel);
        if (o.includes(id)) { const card = S.sel; S.sel = null; sendAction({ t: 'play', card, target: o.length === 2 ? id : null }); }
      }
    },
    koi() { sendAction({ t: 'koi' }); },
    shobu() { sendAction({ t: 'shobu' }); },
    next() { sendAction({ t: 'next' }); },
    toLobby() { S.room.g = null; broadcast(); },
    leaveAsk() { S.askLeave = true; render(); },
    leaveNo() { S.askLeave = false; render(); },
    leaveYes() { location.reload(); }
  };

  // ホスト側での初期メッセージ中継（JOIN受付の特別処理）
  // setupConn内を拡張
  const oldSetup = setupConn;
  setupConn = function() {
    S.conn.on('data', (data) => {
      if (S.isHost && data && data.type === 'JOIN') {
        S.room.seats.b = { id: data.id, name: data.name };
        // ゲストに最新ルーム状態を送信
        S.conn.send({ type: 'ROOM_STATE', room: S.room });
        broadcast();
        return;
      }
      if (S.isHost && data && data.action) {
        const nextG = reduce(S.room.g, data.action, Math.random);
        if (nextG) {
          S.room.g = nextG;
          broadcast();
        }
        return;
      }
      if (!S.isHost && data && data.type === 'ROOM_STATE') {
        S.room = data.room;
        render();
        return;
      }
      if (!S.isHost) {
        S.room = data;
        render();
      }
    });
    S.conn.on('close', () => {
      S.err = '対戦相手との接続が切れました';
      render();
    });
  };

  $app.addEventListener('click', e => {
    const t = e.target.closest('[data-a]');
    if (t && H[t.dataset.a] && !t.disabled) H[t.dataset.a](t);
  });
  $app.addEventListener('input', e => {
    if (e.target.id === 'nameIn') { S.name = e.target.value; lsSet('hf_name', S.name); }
    if (e.target.id === 'codeIn') { S.codeIn = e.target.value.toUpperCase(); e.target.value = S.codeIn; }
  });
  $app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'codeIn') H.join(); });

  render();
})();
</script>
</body>
</html>
